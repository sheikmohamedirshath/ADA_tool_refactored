# Server port (5001 to avoid conflict with Flask on 5000)
server.port=5001

# Optional: run on all interfaces
server.address=0.0.0.0

# Java ADA check: path to the Maven project that contains ADACheckModules/GenericURLADACheck.
# Alternatively set env ADA_JAVA_PROJECT_ROOT. When set, POST /api/process runs:
#   mvn test -Dtest=GenericURLADACheck -Dada.url=<url>
# and returns ADACheckResults/ADAOutput.json as result.axeResult.
# Default: parent of backend (project root). Use an absolute path to point to your Maven ADA project.
# Use forward slashes to avoid backslash escaping issues in .properties
ada.java.project.root=C:/Users/utlap/UI_Design